name: AI PR Summary

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  models: read

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect PR diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr diff ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} > /tmp/pr.diff
          head -c 60000 /tmp/pr.diff > /tmp/pr.input

      - name: Generate summary
        id: ai
        uses: actions/ai-inference@v1
        with:
          model: openai/gpt-4o-mini
          system-prompt: |
            You summarize pull request diffs. Output strict markdown with:
            - A one-sentence overview
            - A bullet list of key changes (max 6 bullets)
            - A short "Risks" section only if obvious risks exist
            Keep the whole response under 1500 characters. No preamble, no closing remarks.
          prompt-file: /tmp/pr.input

      - name: Inject summary into PR body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUMMARY: ${{ steps.ai.outputs.response }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          start = "<!-- ai-summary:start -->"
          end = "<!-- ai-summary:end -->"
          pr = os.environ["PR_NUMBER"]
          repo = os.environ["REPO"]
          summary = os.environ["SUMMARY"].strip()
          body = subprocess.check_output(
              ["gh", "pr", "view", pr, "--repo", repo, "--json", "body", "-q", ".body"],
              text=True,
          )
          body = re.sub(
              rf"{re.escape(start)}.*?{re.escape(end)}\s*",
              "",
              body,
              flags=re.S,
          ).lstrip()
          block = f"{start}\n### AI summary\n{summary}\n{end}\n\n"
          new_body = block + body
          subprocess.run(
              ["gh", "pr", "edit", pr, "--repo", repo, "--body", new_body],
              check=True,
          )
          PY
