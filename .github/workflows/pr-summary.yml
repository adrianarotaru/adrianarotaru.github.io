name: AI PR Summary

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect PR diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr diff ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} > /tmp/pr.diff
          head -c 60000 /tmp/pr.diff > /tmp/pr.input

      - name: Generate summary via Groq
        id: ai
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error

          key = os.environ.get("GROQ_API_KEY", "")
          if not key:
              sys.exit("GROQ_API_KEY secret is empty or missing.")
          print(f"Using GROQ_API_KEY of length {len(key)} starting with {key[:4]}***")

          with open("/tmp/pr.input", "r", errors="replace") as f:
              diff = f.read()

          system = (
              "You summarize pull request diffs. Output strict markdown with:\n"
              "- A one-sentence overview\n"
              "- A bullet list of key changes (max 6 bullets)\n"
              "- A short \"Risks\" section only if obvious risks exist\n"
              "Keep the whole response under 1500 characters. "
              "No preamble, no closing remarks."
          )

          payload = {
              "model": "llama-3.3-70b-versatile",
              "messages": [
                  {"role": "system", "content": system},
                  {"role": "user", "content": diff or "(empty diff)"},
              ],
              "temperature": 0.3,
              "max_tokens": 800,
          }

          req = urllib.request.Request(
              "https://api.groq.com/openai/v1/chat/completions",
              data=json.dumps(payload).encode(),
              headers={
                  "Authorization": f"Bearer {os.environ['GROQ_API_KEY']}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=60) as resp:
                  data = json.loads(resp.read())
          except urllib.error.HTTPError as e:
              body = e.read().decode(errors="replace")
              sys.exit(f"Groq HTTP {e.code}: {body}")

          summary = data["choices"][0]["message"]["content"].strip()
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("response<<__EOF__\n")
              out.write(summary + "\n")
              out.write("__EOF__\n")
          PY

      - name: Inject summary into PR body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUMMARY: ${{ steps.ai.outputs.response }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          start = "<!-- ai-summary:start -->"
          end = "<!-- ai-summary:end -->"
          pr = os.environ["PR_NUMBER"]
          repo = os.environ["REPO"]
          summary = os.environ["SUMMARY"].strip()
          body = subprocess.check_output(
              ["gh", "pr", "view", pr, "--repo", repo, "--json", "body", "-q", ".body"],
              text=True,
          )
          body = re.sub(
              rf"{re.escape(start)}.*?{re.escape(end)}\s*",
              "",
              body,
              flags=re.S,
          ).lstrip()
          block = f"{start}\n### AI summary\n{summary}\n{end}\n\n"
          new_body = block + body
          subprocess.run(
              ["gh", "pr", "edit", pr, "--repo", repo, "--body", new_body],
              check=True,
          )
          PY
